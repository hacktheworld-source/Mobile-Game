<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0e1016" />
  <title>Emberfall</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-item" id="area">Emberfall</div>
      <div id="hearts" aria-label="health"></div>
      <div class="hud-sub" id="status">Lv 1 · 0 gold</div>
      <div class="hud-bar" aria-label="experience">
        <div class="hud-bar-fill xp" id="xp-fill"></div>
      </div>
      <div class="hud-bar" aria-label="mana">
        <div class="hud-bar-fill mana" id="mana-fill"></div>
      </div>
    </div>
    <button id="levelup-btn" class="hidden">LEVEL UP ＋3</button>

    <!-- Character sheet (pauses the game) -->
    <div id="sheet" class="overlay hidden">
      <div class="overlay-card sheet-card">
        <h2>CHARACTER</h2>
        <div class="sheet-points" id="sheet-points"></div>
        <div id="sheet-rows"></div>
        <button id="sheet-close" class="start-btn">RESUME</button>
      </div>
    </div>

    <!-- Touch controls (hidden on devices with no touch) -->
    <div id="controls">
      <!-- The joystick base/knob get positioned dynamically -->
      <div id="joystick" class="joystick hidden">
        <div class="joystick-knob"></div>
      </div>
      <div id="buttons">
        <button id="btn-mode" class="action-btn mode" aria-label="Switch weapon">SWORD</button>
        <button id="btn-dodge" class="action-btn dodge" aria-label="Dodge">DODGE</button>
        <button id="btn-attack" class="action-btn attack" aria-label="Attack">ATK</button>
      </div>
    </div>

    <!-- Overlays -->
    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h1 id="overlay-title">EMBERFALL</h1>
        <p id="overlay-body">
          The last hearth still burns. Move with the left thumb; <b>ATK</b> to
          swing, <b>DODGE</b> to roll through danger.
        </p>
        <p class="overlay-hint" id="overlay-desktop-hint">
          Desktop: <b>WASD</b> move · <b>J</b> / Space attack · <b>K</b> / Shift dodge
        </p>
        <div class="overlay-buttons">
          <button id="overlay-btn" class="start-btn">NEW GAME</button>
          <button id="overlay-btn2" class="start-btn secondary hidden">NEW GAME</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0e1016" />
  <title>Emberfall: The Hollow Crown</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-item" id="area">Emberfall</div>
      <div id="hearts" aria-label="health"></div>
      <div class="hud-sub" id="status">Lv 1 · 0 gold</div>
      <div class="hud-bar" aria-label="experience">
        <div class="hud-bar-fill xp" id="xp-fill"></div>
      </div>
      <div class="hud-bar" aria-label="mana">
        <div class="hud-bar-fill mana" id="mana-fill"></div>
      </div>
    </div>
    <button id="levelup-btn" class="hidden">LEVEL UP ＋3</button>
    <button id="menu-btn" aria-label="Character &amp; gear">☰</button>
    <button id="audio-btn" aria-label="Toggle sound">♪</button>

    <!-- Character sheet (pauses the game) -->
    <div id="sheet" class="overlay hidden">
      <div class="overlay-card sheet-card">
        <h2>CHARACTER</h2>
        <div class="sheet-tabs">
          <button id="tab-stats" class="sheet-tab active">STATS</button>
          <button id="tab-perks" class="sheet-tab">PERKS</button>
          <button id="tab-gear" class="sheet-tab">GEAR</button>
          <button id="tab-map" class="sheet-tab">MAP</button>
        </div>
        <div id="pane-stats">
          <div class="sheet-points" id="sheet-points"></div>
          <div id="sheet-rows"></div>
        </div>
        <div id="pane-perks" class="hidden">
          <div class="sheet-points" id="perk-points"></div>
          <div id="perk-rows" class="sheet-scroll"></div>
        </div>
        <div id="pane-gear" class="hidden">
          <div id="gear-rows" class="sheet-scroll"></div>
        </div>
        <div id="pane-map" class="hidden">
          <div id="map-grid"></div>
          <div id="quest-line"></div>
        </div>
        <button id="sheet-close" class="start-btn">RESUME</button>
      </div>
    </div>

    <!-- Shop (pauses the game) -->
    <div id="shop" class="overlay hidden">
      <div class="overlay-card sheet-card">
        <h2>MERCHANT</h2>
        <div class="sheet-points" id="shop-gold"></div>
        <div id="shop-rows" class="sheet-scroll"></div>
        <button id="shop-close" class="start-btn">LEAVE</button>
      </div>
    </div>

    <!-- Dialogue (tap to advance) -->
    <div id="dialogue" class="hidden">
      <div id="dialogue-name"></div>
      <div id="dialogue-text"></div>
      <div id="dialogue-hint">tap to continue</div>
    </div>

    <!-- Touch controls (hidden on devices with no touch) -->
    <div id="controls">
      <!-- The joystick base/knob get positioned dynamically -->
      <div id="joystick" class="joystick hidden">
        <div class="joystick-knob"></div>
      </div>
      <div id="buttons">
        <button id="btn-mode" class="action-btn mode" aria-label="Switch weapon">SWORD</button>
        <button id="btn-skill" class="action-btn skill hidden" aria-label="Skill">SKILL</button>
        <button id="btn-attack" class="action-btn attack" aria-label="Attack">ATK</button>
      </div>
    </div>

    <!-- Overlays -->
    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h1 id="overlay-title">EMBERFALL</h1>
        <p id="overlay-body">
          The last hearth still burns. Move with the left thumb; hold
          <b>ATK</b> to strike (drag it to aim); <b>swipe</b> anywhere on the
          right and release to dash.
        </p>
        <p class="overlay-hint" id="overlay-desktop-hint">
          Desktop: <b>WASD</b> move · <b>J</b> / Space attack · <b>K</b> / Shift dodge
        </p>
        <div class="overlay-buttons">
          <button id="overlay-btn" class="start-btn">NEW GAME</button>
          <button id="overlay-btn2" class="start-btn secondary hidden">NEW GAME</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
